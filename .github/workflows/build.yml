name: Build Application

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

# Minimal default permissions; release job escalates to write for tags only.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt
        shell: cmd
        run: |
          if not exist C:\Qt mkdir C:\Qt
          rem -E 7z: extract with the runner's 7-Zip. py7zr's path sanitizer
          rem rejects some Qt archive entries and aborts the install.
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir C:\Qt --modules qtwebengine qtwebchannel qtpositioning -E 7z

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Application
        shell: cmd
        run: .\build.bat

      - name: Run Tests
        shell: cmd
        working-directory: build
        run: ctest --output-on-failure --timeout 120

      - name: List Build Output
        run: dir build\Release\bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TinyTools-Release
          path: build/Release/bin/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Escalate write permission only for the release job on tag pushes
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: TinyTools-Release
          path: release-bin/

      - name: Create archive
        run: |
          cd release-bin
          zip -r ../TinyTools-${{ github.ref_name }}.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: TinyTools-${{ github.ref_name }}.zip
